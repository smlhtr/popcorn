<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0C0A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Popcorn">
  <meta name="description" content="Where films and series stream on Netflix, Prime Video, Disney+, and free with ads.">
  <title>Popcorn</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <style>
    :root {
      --bg: #0E0C0A;
      --bg2: #151310;
      --card: #1C1914;
      --card2: #242017;
      --gold: #E0B84A;
      --gold-dim: #A6842E;
      --text: #F6F1E6;
      --muted: #9A9284;
      --line: #2C281F;
      --netflix: #E50914;
      --prime: #00A8E1;
      --disney: #1A3FDB;
      --free: #E8B84A;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    body { padding: 0; overflow: hidden; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    .app { height: 100%; display: flex; flex-direction: column; }
    header.app-header {
      padding: calc(var(--safe-t) + 10px) 16px 10px;
      background: linear-gradient(180deg, #17140f 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .brand h1 { font-size: 22px; letter-spacing: -0.03em; margin: 0; font-weight: 700; }
    .brand h1 span { color: var(--gold); }
    .brand .meta { color: var(--muted); font-size: 12px; }

    .search {
      width: 100%; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 11px 14px 11px 38px; color: var(--text);
      outline: none;
    }
    .search:focus { border-color: var(--gold-dim); }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .55; }

    .filters { display: flex; flex-direction: column; gap: 8px; padding: 10px 0 2px; }
    .filters-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .filters-row::-webkit-scrollbar { display: none; }
    .chip, .country-select {
      flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
      color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 13px;
    }
    .chip.on { background: var(--gold); color: #1A1408; border-color: var(--gold); font-weight: 600; }
    .country-select { max-width: 160px; appearance: none; padding-right: 24px;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

    main { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px calc(88px + var(--safe-b)); }
    .count { color: var(--muted); font-size: 12px; margin: 6px 0 10px; }

    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 14px 14px 12px; margin-bottom: 10px;
    }
    .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .card h2 { margin: 0 0 2px; font-size: 17px; letter-spacing: -0.02em; font-weight: 650; line-height: 1.25; }
    .sub { color: var(--muted); font-size: 12px; }
    .type-pill { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold);
      border: 1px solid #3A3320; border-radius: 999px; padding: 2px 7px; font-weight: 600; }
    .logos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .none { color: var(--muted); font-size: 12px; margin-top: 10px; font-style: italic; }

    .svc {
      border: 0; border-radius: 10px; height: 40px; min-width: 40px; padding: 0 8px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 2px 6px rgba(0,0,0,.35);
    }
    .svc svg { display: block; }
    .svc .name { font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
    .svc.netflix { background: #E50914; color: #fff; }
    .svc.prime { background: #0F171E; color: #00A8E1; }
    .svc.disney { background: #0B1B4A; color: #fff; padding: 0 10px 0 8px; min-width: 64px; }
    .svc.free { background: #2A2314; color: var(--gold); border: 1px solid #4A3D1C; }
    .svc.tubi { background: #121212; color: #FF3B00; }
    .svc.pluto, .svc.plutotv { background: #1B2BFF; color: #fff; }
    .svc.rokuchannel, .svc.therokuchannel { background: #6C3C97; color: #fff; }
    .svc.plex { background: #E5A00D; color: #1A1200; }
    .svc.youtubefree, .svc.youtube { background: #FF0000; color: #fff; }
    .svc.library { background: #2A2433; color: #C9B8E8; border: 1px solid #3E3550; }

    nav.tabbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: rgba(18,16,13,.94); backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
      display: flex; padding: 6px 16px calc(var(--safe-b) + 6px);
      z-index: 20;
    }
    nav.tabbar button {
      flex: 1; background: none; border: 0; color: var(--muted); padding: 8px 0 4px;
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    }
    nav.tabbar button.on { color: var(--gold); }

    /* Detail */
    .panel {
      position: fixed; inset: 0; background: var(--bg); z-index: 30;
      display: none; flex-direction: column;
      animation: rise .28s ease;
    }
    .panel.show { display: flex; }
    @keyframes rise { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
    .panel-head {
      padding: calc(var(--safe-t) + 8px) 12px 10px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--line); flex: 0 0 auto;
    }
    .back { background: none; border: 0; color: var(--gold); font-size: 16px; font-weight: 600; padding: 8px 10px; }
    .panel-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 20px calc(28px + var(--safe-b)); }
    .panel-body h2 { font-size: 28px; letter-spacing: -0.04em; margin: 0 0 6px; line-height: 1.15; }
    .notes { color: #C9C0B0; font-size: 14px; line-height: 1.5; margin: 14px 0 0; }
    .section-label { margin: 22px 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .checked { margin-top: 22px; color: var(--muted); font-size: 11px; }
    .jw { color: var(--gold-dim); font-size: 13px; display: inline-block; margin-top: 10px; }

    /* Sheet */
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
      display: none; opacity: 0; transition: opacity .2s;
    }
    .sheet-backdrop.show { display: block; opacity: 1; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
      background: #1A1713; border-radius: 20px 20px 0 0;
      max-height: 82vh; display: none; flex-direction: column;
      transform: translateY(110%); transition: transform .28s ease;
      padding-bottom: var(--safe-b);
    }
    .sheet.show { display: flex; transform: translateY(0); }
    .sheet .handle { width: 40px; height: 4px; background: #4A4538; border-radius: 4px; margin: 10px auto 6px; }
    .sheet-head { padding: 4px 20px 12px; border-bottom: 1px solid var(--line); }
    .sheet-head h3 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .sheet-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .sheet-search { margin: 10px 20px 0; }
    .sheet-search input { width: 100%; background: var(--card2); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 12px; outline: none; }
    .country-list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 8px 16px; }
    .country-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 15px; }
    .country-row .flag { font-size: 22px; width: 32px; text-align: center; line-height: 1; }
    .group-label { padding: 12px 16px 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .lib-note { font-size: 12px; color: #C9B8E8; margin: 0; }

    /* VPN */
    .vpn-intro { color: #C9C0B0; font-size: 14px; line-height: 1.5; margin: 4px 0 16px; }
    .vpn-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
    .vpn-card.top { border-color: var(--gold-dim); background: linear-gradient(180deg, #2A2314, var(--card)); }
    .vpn-rank { display: flex; align-items: center; gap: 10px; }
    .vpn-rank .n { width: 28px; height: 28px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--gold); }
    .vpn-card.top .n { background: var(--gold); color: #1A1408; }
    .vpn-name { font-size: 17px; font-weight: 650; }
    .vpn-count { margin-left: auto; font-weight: 700; color: var(--gold); font-size: 20px; }
    .vpn-break { display: flex; gap: 8px; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .vpn-break span { background: var(--card2); border-radius: 999px; padding: 4px 8px; }
    .vpn-titles { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .vpn-card.open .vpn-titles { display: block; }
    .vpn-titles button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text);
      padding: 8px 4px; font-size: 15px; border-radius: 8px; }
    .vpn-titles button:active { background: var(--card2); }

    .hidden { display: none !important; }
    .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

    .card.watched { opacity: 0.58; }
    .card.watched h2 { text-decoration: line-through; text-decoration-color: #6F6758; text-decoration-thickness: 1.5px; }
    .watch-btn {
      flex: 0 0 auto; width: 44px; height: 44px; margin: -8px 0 0 -8px;
      border: 0; background: none; padding: 0;
      display: grid; place-items: center; color: var(--muted);
    }
    .watch-btn .box {
      width: 22px; height: 22px; border-radius: 7px;
      border: 1.5px solid #5A5346; background: #16130F;
      display: grid; place-items: center;
    }
    .watch-btn.on .box {
      background: var(--gold); border-color: var(--gold); color: #1A1408;
    }
    .card-copy { flex: 1 1 auto; min-width: 0; }
    .watch-detail {
      display: inline-flex; align-items: center; gap: 10px;
      margin-top: 16px; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 14px 10px 10px; font-size: 14px; font-weight: 600;
      color: var(--text);
    }
    .watch-detail .box {
      width: 22px; height: 22px; border-radius: 7px;
      border: 1.5px solid #5A5346; background: #16130F;
      display: grid; place-items: center; color: var(--muted);
    }
    .watch-detail.on { border-color: var(--gold-dim); color: var(--gold); }
    .watch-detail.on .box { background: var(--gold); border-color: var(--gold); color: #1A1408; }
    .panel-body h2.watched-title { text-decoration: line-through; text-decoration-color: #6F6758; }
  </style>
</head>

      <div class="brand">

        <div class="meta" id="brand-meta"></div>
      </div>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9284" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

  <div class="panel" id="detail"></div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

t","apostle","when-evil-lurks","werewolves-within","midnight-mass","dark","stranger-things"]},{"rank":130,"code":"AZ","name":"Azerbaijan","flag":"🇦🇿","count":6,"netflix":6,"prime":0,"disney":0,"titles":["apostle","nosferatu","smile-2","midnight-mass","dark","stranger-things"]},{"rank":131,"code":"MU","name":"Mauritius","flag":"🇲🇺","count":6,"netflix":6,"prime":0,"disney":0,"titles":["apostle","bring-her-back","orphan","midnight-mass","dark","stranger-things"]},{"rank":132,"code":"BY","name":"Belarus","flag":"🇧🇾","count":5,"netflix":5,"prime":0,"disney":0,"titles":["apostle","nosferatu","midnight-mass","dark","stranger-things"]},{"rank":133,"code":"UA","name":"Ukraine","flag":"🇺🇦","count":5,"netflix":5,"prime":0,"disney":0,"titles":["apostle","nosferatu","smile-2","midnight-mass","stranger-things"]},{"rank":134,"code":"MW","name":"Malawi","flag":"🇲🇼","count":5,"netflix":0,"prime":5,"disney":0,"titles":["get-out","nosferatu","hell-house-llc","the-wolf-of-snow-hollow","werewolves-within"]},{"rank":135,"code":"BF","name":"Burkina Faso","flag":"🇧🇫","count":4,"netflix":0,"prime":4,"disney":0,"titles":["get-out","nosferatu","the-wolf-of-snow-hollow","we-are-still-here"]},{"rank":136,"code":"CD","name":"DR Congo","flag":"🇨🇩","count":4,"netflix":0,"prime":4,"disney":0,"titles":["get-out","nosferatu","the-wolf-of-snow-hollow","we-are-still-here"]},{"rank":137,"code":"PG","name":"Papua New Guinea","flag":"🇵🇬","count":3,"netflix":0,"prime":3,"disney":0,"titles":["get-out","hell-house-llc","the-wolf-of-snow-hollow"]}]}</script>
  <script>
  const DATA = JSON.parse(document.getElementById('catalog').textContent);
  const COUNTRY = Object.fromEntries(DATA.countries.map(c => [c.code, c]));
  function flag(cc) { return (COUNTRY[cc] && COUNTRY[cc].flag) || ''; }
  function cname(cc) { return (COUNTRY[cc] && COUNTRY[cc].name) || cc; }
  function $(id) { return document.getElementById(id); }

  const SVG = {
    netflix: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M5 2h4.2l5.6 14.2V2H19v20h-4.1L9.2 7.6V22H5V2z"/></svg>',
    prime: '<svg width="34" height="16" viewBox="0 0 54 18" aria-hidden="true"><text x="0" y="12" fill="#fff" font-size="11" font-weight="700" font-family="-apple-system,system-ui,sans-serif">prime</text><path d="M8 15c8 3 22 3 32-1" fill="none" stroke="#00A8E1" stroke-width="1.8" stroke-linecap="round"/><path d="M38 12.5l3.2 1.6-3.2 1.8" fill="#00A8E1"/></svg>',
    disney: '<svg width="62" height="18" viewBox="0 0 92 18" aria-hidden="true"><text x="1" y="14" fill="#fff" font-size="14" font-weight="600" font-style="italic" font-family="Georgia,Times,serif">disney+</text></svg>',
    free: '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16v4H4V4zm0 6h16v10H4V10zm3 3v4h2v-4H7z"/></svg>'
  };

  const WATCH_KEY = 'popcorn-watched';
  function loadWatched() {
    try {
      const raw = JSON.parse(localStorage.getItem(WATCH_KEY) || '[]');
      if (Array.isArray(raw)) return new Set(raw.filter(Boolean));
      if (raw && typeof raw === 'object') return new Set(Object.keys(raw).filter(k => raw[k]));
    } catch (e) {}
    return new Set();
  }
  function saveWatched() {
    localStorage.setItem(WATCH_KEY, JSON.stringify([...watched]));
  }
  let watched = loadWatched();
  function isWatched(id) { return watched.has(id); }
  function toggleWatched(id) {
    if (watched.has(id)) watched.delete(id);
    else watched.add(id);
    saveWatched();
  }
  function checkSvg() {
    return '<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.2 16.6L4.8 12.2l-1.4 1.4 5.8 5.8 12-12-1.4-1.4z"/></svg>';
  }
  function watchBtn(id, detail) {
    const on = isWatched(id);
    const label = on ? 'Mark as unwatched' : 'Mark as watched';
    if (detail) {
      return `<button type="button" class="watch-detail${on ? ' on' : ''}" data-watch="${escapeHtml(id)}" aria-pressed="${on ? 'true' : 'false'}">
        <span class="box">${on ? checkSvg() : ''}</span>
        ${on ? 'Watched' : 'Mark as watched'}
      </button>`;
    }
    return `<button type="button" class="watch-btn${on ? ' on' : ''}" data-watch="${escapeHtml(id)}" aria-label="${label}" aria-pressed="${on ? 'true' : 'false'}"><span class="box">${on ? checkSvg() : ''}</span></button>`;
  }

  let state = { view: 'list', q: '', service: 'all', country: 'all', type: 'all', seen: 'all', openId: null, sheet: null };

  function titleById(id) { return DATA.titles.find(t => t.id === id); }

  function paidServices(t) {
    const out = [];
    if (t.services.netflix) out.push({ key: 'netflix', label: 'Netflix', countries: t.services.netflix.countries });
    if (t.services.prime) out.push({ key: 'prime', label: 'Prime Video', countries: t.services.prime.countries });
    if (t.services.disney) out.push({ key: 'disney', label: 'Disney+', countries: t.services.disney.countries });
    return out;
  }
  function allFree(t) { return t.services.free || []; }
  function hasAny(t) { return paidServices(t).length + allFree(t).length > 0; }

  function matches(t) {
    const q = state.q.trim().toLowerCase();
    if (q) {
      const hay = (t.title + ' ' + t.year + ' ' + t.credit + ' ' + (t.notes || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (state.type !== 'all' && t.type !== state.type) return false;
    if (state.seen === 'watched' && !isWatched(t.id)) return false;
    if (state.seen === 'unwatched' && isWatched(t.id)) return false;
    const cc = state.country;
    const inCountry = (countries) => cc === 'all' || countries.includes(cc);
    if (state.service === 'all') {
      if (cc === 'all') return true;
      return paidServices(t).some(s => inCountry(s.countries)) || allFree(t).some(s => inCountry(s.countries));
    }
    if (state.service === 'free') return allFree(t).some(s => inCountry(s.countries));
    const s = t.services[state.service];
    return !!(s && inCountry(s.countries));
  }

  function logoBtn(svc, titleId, compact) {
    const key = svc.key || svc.id;
    const cls = ['svc', key, svc.kind === 'library' ? 'library' : '',
      (key === 'tubitv' || key === 'tubitvads') ? 'tubi' : '',
      key.includes('pluto') ? 'pluto' : '',
      key.includes('roku') ? 'rokuchannel' : '',
      key.includes('plex') ? 'plex' : '',
      key.includes('youtube') ? 'youtube' : '',
      ['netflix','prime','disney'].includes(key) ? key : (svc.kind === 'library' ? 'library' : 'free')
    ].filter(Boolean).join(' ');
    let inner = '';
    if (key === 'netflix') inner = SVG.netflix;
    else if (key === 'prime') inner = SVG.prime;
    else if (key === 'disney') inner = SVG.disney + (compact ? '' : '<span class="name"></span>');
    else if (compact && key === 'free') inner = SVG.free + '<span class="name">Free</span>';
    else inner = '<span class="name">' + escapeHtml(svc.label) + '</span>';
    return `<button type="button" class="${cls}" data-open-svc="${escapeHtml(titleId)}" data-svc="${escapeHtml(key)}" aria-label="${escapeHtml(svc.label)}">${inner}</button>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function logosRow(t, detail) {
    const inCountry = (countries) => state.country === 'all' || countries.includes(state.country);
    const paid = paidServices(t).filter(s => inCountry(s.countries));
    const free = allFree(t).filter(s => inCountry(s.countries));
    if (!paid.length && !free.length) {
      const any = paidServices(t).length + allFree(t).length;
      const msg = state.country !== 'all' && any
        ? 'Not on Netflix, Prime Video, Disney+, or free with ads in ' + (cname(state.country) || state.country)
        : 'Not on Netflix, Prime Video, Disney+, or free with ads';
      return `<div class="none">${msg}</div>`;
    }
    let html = '<div class="logos">';
    paid.forEach(s => { html += logoBtn(s, t.id, !detail); });
    if (detail) {
      free.forEach(s => { html += logoBtn(s, t.id, false); });
    } else if (free.length) {
      html += logoBtn({ key: 'free', label: 'Free with ads', id: 'free' }, t.id, true);
    }
    html += '</div>';
    return html;
  }

  function renderFilters() {
    const used = new Set();
    DATA.titles.forEach(t => {
      paidServices(t).forEach(s => s.countries.forEach(c => used.add(c)));
      allFree(t).forEach(s => s.countries.forEach(c => used.add(c)));
    });
    const countries = DATA.countries.filter(c => used.has(c.code));
    const chips = [
      ['all', 'All'], ['netflix', 'Netflix'], ['prime', 'Prime'], ['disney', 'Disney+'], ['free', 'Free']
    ].map(([k,l]) => `<button type="button" class="chip${state.service===k?' on':''}" data-svc-filter="${k}">${l}</button>`).join('');
    const types = [
      ['movie','Films'], ['show','Series']
    ].map(([k,l]) => `<button type="button" class="chip${state.type===k?' on':''}" data-type-filter="${k}">${l}</button>`).join('');
    const opts = ['<option value="all">Any country</option>']
      .concat(countries.map(c => `<option value="${c.code}"${state.country===c.code?' selected':''}>${c.flag} ${c.name}</option>`));
    const seen = [
      ['all', 'All'], ['unwatched', 'To watch'], ['watched', 'Watched']
    ].map(([k,l]) => `<button type="button" class="chip${state.seen===k?' on':''}" data-seen-filter="${k}">${l}</button>`).join('');
    $('filters').innerHTML = `<div class="filters-row">${chips}</div><div class="filters-row">${seen}</div><div class="filters-row">${types}<select class="country-select" id="country">${opts.join('')}</select></div>`;
  }

  function renderList() {
    const items = DATA.titles.filter(matches);
    $('brand-meta').textContent = DATA.meta.movies + ' films · ' + DATA.meta.shows + ' series';
    const watchedN = DATA.titles.filter(t => isWatched(t.id)).length;
    let html = `<div class="count">${items.length} of ${DATA.titles.length} · ${watchedN} of ${DATA.titles.length} watched</div>`;
    if (!items.length) html += '<div class="empty">No titles match those filters.</div>';
    items.forEach(t => {
      html += `<article class="card${isWatched(t.id) ? ' watched' : ''}" data-open-title="${t.id}">
        <div class="card-top">
          ${watchBtn(t.id, false)}
          <div class="card-copy">
            <h2>${escapeHtml(t.title)}</h2>
            <div class="sub">${t.year} · ${escapeHtml(t.credit)}</div>
          </div>
          <span class="type-pill">${t.type === 'show' ? 'Series' : 'Film'}</span>
        </div>
        ${logosRow(t, false)}
      </article>`;
    });
    $('main').innerHTML = html;
    $('list-header').classList.remove('hidden');
    document.querySelector('.search-wrap').classList.remove('hidden');
    $('filters').classList.remove('hidden');
  }

  function renderVpn() {
    $('brand-meta').textContent = 'Best single hop';
    const leader = DATA.vpn[0];
    const lead = leader ? (leader.flag + ' ' + leader.name + ' currently leads.') : '';
    let html = `<div class="vpn-intro">Countries ranked by how many of these ${DATA.titles.length} titles are on Netflix, Prime Video, or Disney+ at no extra cost (not counting free-with-ads). ${lead} Catalogues checked ${DATA.meta.checks.map(c=>c.date).join(', ')}.</div>`;
    DATA.vpn.forEach(v => {
      const top = v.rank === 1 ? ' top' : '';
      const titles = v.titles.map(id => {
        const t = titleById(id);
        return `<button type="button" data-open-title="${t.id}">${escapeHtml(t.title)} <span class="sub">(${t.year})</span></button>`;
      }).join('');
      html += `<article class="vpn-card${top}" data-vpn="${v.code}">
        <div class="vpn-rank">
          <div class="n">${v.rank}</div>
          <div class="vpn-name">${v.flag} ${escapeHtml(v.name)}</div>
          <div class="vpn-count">${v.count}</div>
        </div>
        <div class="vpn-break"><span>Netflix ${v.netflix}</span><span>Prime ${v.prime}</span><span>Disney+ ${v.disney}</span></div>
        <div class="vpn-titles">${titles}</div>
      </article>`;
    });
    $('main').innerHTML = html;
    $('list-header').classList.remove('hidden');
    document.querySelector('.search-wrap').classList.add('hidden');
    $('filters').classList.add('hidden');
  }

  function renderDetail(t) {
    const creditLabel = t.type === 'show' ? 'Created by' : 'Directed by';
    $('detail').innerHTML = `
      <div class="panel-head">
        <button type="button" class="back" id="back">‹ Back</button>
      </div>
      <div class="panel-body">
        <span class="type-pill">${t.type === 'show' ? 'Series' : 'Film'}</span>
        <h2 class="${isWatched(t.id) ? 'watched-title' : ''}">${escapeHtml(t.title)}</h2>
        <div class="sub">${t.year} · ${creditLabel} ${escapeHtml(t.credit)}</div>
        ${t.notes ? `<p class="notes">${escapeHtml(t.notes)}</p>` : ''}
        ${watchBtn(t.id, true)}
        <div class="section-label">Tap a service to see countries</div>
        ${logosRow(t, true)}
        <div class="checked">JustWatch catalogue checked ${escapeHtml(t.checked)}. ${escapeHtml(DATA.meta.note)}</div>
      </div>`;
    $('detail').classList.add('show');
    $('back').onclick = () => history.back();
  }

  function closeSheet() {
    $('sheet').classList.remove('show');
    $('backdrop').classList.remove('show');
    state.sheet = null;
    setTimeout(() => { if (!state.sheet) { $('sheet').style.display = 'none'; $('backdrop').style.display = 'none'; } }, 220);
  }

  function openSheet(title, svcKey) {
    const t = title;
    let label, countries, note = '', groups = null;
    if (svcKey === 'free') {
      label = 'Free with ads';
      groups = allFree(t);
      countries = [];
    } else if (svcKey === 'netflix' || svcKey === 'prime' || svcKey === 'disney') {
      const s = t.services[svcKey];
      if (!s) return;
      label = s.label;
      countries = s.countries;
    } else {
      const s = allFree(t).find(x => x.id === svcKey);
      if (!s) return;
      label = s.label;
      countries = s.countries;
      if (s.kind === 'library') note = 'Needs a library card.';
    }
    const logoKey = (svcKey === 'netflix' || svcKey === 'prime' || svcKey === 'disney') ? svcKey : 'free';
    const countLabel = groups
      ? groups.reduce((n,g) => n + g.countries.length, 0) + ' listings'
      : (countries.length + ' ' + (countries.length === 1 ? 'country' : 'countries'));
    const showSearch = groups ? groups.some(g => g.countries.length > 12) : countries.length > 12;
    $('sheet').innerHTML = `
      <div class="handle"></div>
      <div class="sheet-head">
        <h3>${logoBtn({ key: logoKey, label, id: logoKey }, t.id, true).replace(/data-open-svc/g, 'data-noop')} ${escapeHtml(label)}</h3>
        <p>${escapeHtml(t.title)} · ${countLabel}${note ? ' · ' + note : ''}</p>
        ${note ? `<p class="lib-note">${note}</p>` : ''}
      </div>
      ${showSearch ? '<div class="sheet-search"><input id="sheet-q" type="search" placeholder="Filter countries"></div>' : ''}
      <div class="country-list" id="sheet-list"></div>`;
    function rowsFor(list) {
      return list.slice().sort((a,b) => cname(a).localeCompare(cname(b)))
        .map(cc => `<div class="country-row" data-name="${escapeHtml(cname(cc)).toLowerCase()}"><span class="flag">${flag(cc)}</span><span>${escapeHtml(cname(cc))}</span></div>`).join('');
    }
    function paint(filter) {
      const q = (filter || '').trim().toLowerCase();
      let html = '';
      if (groups) {
        groups.forEach(g => {
          const list = g.countries.filter(cc => !q || cname(cc).toLowerCase().includes(q) || cc.toLowerCase().includes(q));
          if (!list.length) return;
          html += `<div class="group-label">${escapeHtml(g.label)}${g.kind==='library' ? ' · library card' : ''} · ${list.length}</div>` + rowsFor(list);
        });
      } else {
        const list = countries.filter(cc => !q || cname(cc).toLowerCase().includes(q) || cc.toLowerCase().includes(q));
        html = rowsFor(list) || '<div class="empty">No countries match.</div>';
      }
      $('sheet-list').innerHTML = html || '<div class="empty">No countries match.</div>';
    }
    paint('');
    const si = $('sheet-q');
    if (si) si.addEventListener('input', e => paint(e.target.value));
    $('sheet').style.display = 'flex';
    $('backdrop').style.display = 'block';
    requestAnimationFrame(() => { $('sheet').classList.add('show'); $('backdrop').classList.add('show'); });
    state.sheet = svcKey;
  }

  function route() {
    const hash = location.hash.replace(/^#/, '') || '/';
    const detailMatch = hash.match(/^\/title\/([^/]+)/);
    if (hash.startsWith('/vpn')) {
      state.view = 'vpn';
      state.openId = null;
      $('detail').classList.remove('show');
      $('tab-vpn').classList.add('on');
      $('tab-list').classList.remove('on');
      renderFilters();
      renderVpn();
    } else if (detailMatch) {
      const t = titleById(detailMatch[1]);
      if (!t) { location.hash = '#/'; return; }
      state.view = 'detail';
      state.openId = t.id;
      $('tab-list').classList.add('on');
      $('tab-vpn').classList.remove('on');
      renderFilters();
      renderList();
      renderDetail(t);
    } else {
      state.view = 'list';
      state.openId = null;
      $('detail').classList.remove('show');
      $('tab-list').classList.add('on');
      $('tab-vpn').classList.remove('on');
      renderFilters();
      renderList();
    }
  }

  document.addEventListener('input', e => {
    if (e.target.id === 'q') { state.q = e.target.value; if (state.view === 'list') renderList(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'country') { state.country = e.target.value; if (state.view === 'list') renderList(); }
  });
  document.addEventListener('click', e => {
    const watchBtnEl = e.target.closest('[data-watch]');
    if (watchBtnEl) {
      e.preventDefault(); e.stopPropagation();
      const id = watchBtnEl.getAttribute('data-watch');
      toggleWatched(id);
      if (state.view === 'detail' && state.openId) {
        const t = titleById(state.openId);
        renderFilters();
        renderList();
        if (t) renderDetail(t);
      } else if (state.view === 'list') {
        renderFilters();
        renderList();
      }
      return;
    }
    const seenFilter = e.target.closest('[data-seen-filter]');
    if (seenFilter) { state.seen = seenFilter.getAttribute('data-seen-filter'); if (state.view==='list') { renderFilters(); renderList(); } return; }
    const svcFilter = e.target.closest('[data-svc-filter]');
    if (svcFilter) { state.service = svcFilter.getAttribute('data-svc-filter'); if (state.view==='list') { renderFilters(); renderList(); } return; }
    const typeFilter = e.target.closest('[data-type-filter]');
    if (typeFilter) {
      const k = typeFilter.getAttribute('data-type-filter');
      state.type = state.type === k ? 'all' : k;
      if (state.view==='list') { renderFilters(); renderList(); }
      return;
    }
    const openSvc = e.target.closest('[data-open-svc]');
    if (openSvc && !openSvc.hasAttribute('data-noop')) {
      e.preventDefault(); e.stopPropagation();
      const t = titleById(openSvc.getAttribute('data-open-svc'));
      if (t) openSheet(t, openSvc.getAttribute('data-svc'));
      return;
    }
    const vpnCard = e.target.closest('[data-vpn]');
    if (vpnCard) {
      state.country = vpnCard.getAttribute('data-vpn');
      if (location.hash.replace(/^#/, '') === '/' || location.hash === '' || location.hash === '#') {
        renderFilters(); renderList();
        window.scrollTo(0,0);
        document.getElementById('main').scrollTop = 0;
      } else {
        location.hash = '#/';
      }
      return;
    }
    const openTitle = e.target.closest('[data-open-title]');
    if (openTitle) {
      location.hash = '#/title/' + openTitle.getAttribute('data-open-title');
      return;
    }
    if (e.target.id === 'tab-list') { location.hash = '#/'; return; }
    if (e.target.id === 'tab-vpn') { location.hash = '#/vpn'; return; }
    if (e.target.id === 'backdrop') closeSheet();
  });
  window.addEventListener('hashchange', route);
  $('backdrop').addEventListener('click', closeSheet);
  route();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  </script>
</body>
</html>
